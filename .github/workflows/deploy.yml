# Veröffentlicht bei jedem Push auf "main" das Songbook über GitHub Pages (music.nikschreiner.de).
# Vorher wird es aus songs/*.txt neu gebaut und geprüft; bei einem Fehler bleibt die bisherige Seite stehen.
# Darum genügt es, eine Songdatei zu ändern, auch direkt auf github.com: songs.js und sw.js entstehen hier.
#
# Einrichtung (einmalig): siehe docs/deploy.md. Es braucht keine Secrets.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manueller Lauf über den Reiter "Actions", ohne extra Commit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Songbook bauen und prüfen
        run: |
          set -euo pipefail
          python3 tools/build.py
          node --check app.js
          node --check sw.js
          test "$(ls songs/*.txt | wc -l)" -gt 0

      - name: Seite zusammenstellen
        run: |
          set -euo pipefail
          mkdir site
          cp CNAME index.html app.js songs.js sw.js manifest.webmanifest dist/mantra-collection.html site/
          cp -R assets audio site/
          # Sicherheitsnetz: keine Quellen und Werkzeuge auf der Seite
          test ! -d site/tools
          test ! -d site/songs
          find site -type f | sort

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seite übergeben
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
